name: CI - api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '!api/**/*.md'
      - '.github/workflows/ci-api.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'api/**'
      - '!api/**/*.md'
      - '.github/workflows/ci-api.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The steps run on the runner rather than in a container, so the service is
    # reached through the published port on 127.0.0.1, not by its label.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wisp
          POSTGRES_PASSWORD: wisp
          POSTGRES_DB: wisp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisp -d wisp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Build
        run: cd api && go build -v ./...
      - name: Test
        run: cd api && go test -v ./...
        env:
          WISP_TEST_PG_DSN: host=127.0.0.1 port=5432 user=wisp password=wisp dbname=wisp sslmode=disable TimeZone=UTC

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          working-directory: api

  build:
    name: Build & Push
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mikyk10/wisp/api
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
