openapi: 3.0.4
info:
  title: WiSP API
  description: |
    <h2>WiSP (Wireless Image Slideshow for Photoframes)</h2>

    Backend API for the WiSP e-Paper photo frame system.
    Serves processed images to ESP32 devices and provides catalog management endpoints for the admin SPA.

  version: "2025-03-01"

servers:
  - url: 'http://localhost:9002'
    description: Local development

tags:
  - name: system
    description: Health and version information
  - name: catalogs
    description: Catalog and image management
  - name: device
    description: Image delivery endpoints for ESP32 devices
  - name: devices
    description: |
      Operator-facing views of the configured displays and what has been delivered to them.
      Distinct from `device`, which is what the ESP32 itself calls.

paths:

  /health:
    get:
      tags:
        - system
      summary: Liveness probe
      responses:
        '200':
          description: Server is running
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /version:
    get:
      tags:
        - system
      summary: Build version and commit hash
      responses:
        '200':
          description: Version string
          content:
            text/plain:
              schema:
                type: string
                example: "v1.2.3 (abc1234) built 2025-03-01T00:00:00"

  /api/catalogs:
    get:
      tags:
        - catalogs
      summary: List all configured catalogs
      responses:
        '200':
          description: List of catalog keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalogs:
                    type: array
                    items:
                      type: string
                    example: ["photos", "dashboard"]
        '500':
          $ref: '#/components/responses/InternalError'

  /api/catalog/{catalogKey}/images:
    get:
      tags:
        - catalogs
      summary: Stream all images in a catalog
      description: |
        Returns a newline-delimited JSON (NDJSON) stream of images indexed in the catalog.
        Each line is a JSON object. The stream ends when all images have been sent.
      parameters:
        - $ref: '#/components/parameters/CatalogKey'
      responses:
        '200':
          description: NDJSON stream of images
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ImageRecord'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/catalog/{catalogKey}/image/{imgid}:
    get:
      tags:
        - catalogs
      summary: Get a thumbnail image by ID
      description: |
        Returns the thumbnail for the specified image. The file format is determined by the
        extension of `imgid` (`.jpg` or `.png`). If the image is not found or has no thumbnail,
        a placeholder image is returned with HTTP 404.
      parameters:
        - $ref: '#/components/parameters/CatalogKey'
        - in: path
          name: imgid
          required: true
          description: Image ID with extension, e.g. `42.jpg`
          schema:
            type: string
            example: "42.jpg"
      responses:
        '200':
          description: Image data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found — placeholder image is returned
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /api/catalog/selected/_toggle-visibility:
    post:
      tags:
        - catalogs
      summary: Toggle visibility for a list of images
      description: |
        Toggles the enabled/disabled state of the specified images within the given catalog.
        Disabled images are excluded from random delivery to devices.
      parameters:
        - in: query
          name: catalogKey
          required: true
          description: Catalog key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 5, 12]
      responses:
        '200':
          description: Visibility toggled successfully
        '500':
          $ref: '#/components/responses/InternalError'

  /api/devices:
    get:
      tags:
        - devices
      summary: List every configured display
      description: |
        Returns one entry per display named in `service.yaml`, ordered by key, whether or not
        that display has ever been heard from. The list is built from the configuration and
        never from the delivery history, so a frame that has never once phoned home is present
        and visibly silent rather than missing.

        `last_delivered_at` is the only thing the server can honestly report about a panel: it
        wrote the bytes out. Whether the device was awake to receive them, or able to render
        them, is not knowable here.
      responses:
        '200':
          description: The configured displays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/device/{displayKey}/deliveries:
    get:
      tags:
        - devices
      summary: List a display's recent deliveries
      description: |
        Returns what was handed to the display, newest first. The store is a fixed-size ring
        per display — see `delivery_history.size` in `config.yaml` — so this is the recent past
        and not a full log; the oldest entry is overwritten rather than kept.

        A configured display that has never been delivered to answers with an empty list. A
        display key that is not in `service.yaml` is a 404.
      parameters:
        - $ref: '#/components/parameters/DisplayKey'
        - in: query
          name: limit
          required: false
          description: |
            How many deliveries to return. Clamped to the configured ring size, which is also
            the default and what a value of zero or less asks for.
          schema:
            type: integer
            minimum: 1
            example: 20
      responses:
        '200':
          description: The display's recent deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryList'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /pf/{displayKey}/image/{imgid}:
    get:
      tags:
        - device
      summary: Get a specific image for a device
      description: |
        Returns the image with the given ID, processed and encoded for the specified display.
        The file format is determined by the extension of `imgid`.
      parameters:
        - $ref: '#/components/parameters/DisplayKey'
        - in: path
          name: imgid
          required: true
          description: Image ID with extension, e.g. `42.jpg`
          schema:
            type: string
            example: "42.jpg"
      responses:
        '200':
          description: Processed image data
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found — placeholder image is returned

  /pf/{displayKey}/image/random.bin:
    get:
      tags:
        - device
      summary: Get a random image for a device (Waveshare binary)
      description: |
        Picks a random enabled image from the catalogs assigned to the display, applies the full
        image processing pipeline (EXIF rotation, crop, filters, color reduction, optional flip),
        and returns it in Waveshare e-Paper proprietary binary format.

        The `X-Sleep-Seconds` response header tells the ESP32 how many seconds to sleep before
        the next request.
      parameters:
        - $ref: '#/components/parameters/DisplayKey'
      responses:
        '200':
          description: Processed image in Waveshare binary format
          headers:
            X-Sleep-Seconds:
              description: Seconds the device should sleep before the next request
              schema:
                type: integer
                example: 300
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /pf/{displayKey}/image/random.jpg:
    get:
      tags:
        - device
      summary: Get a random image for a device (JPEG)
      description: Same as `random.bin` but returns a JPEG instead of the vendor binary.
      parameters:
        - $ref: '#/components/parameters/DisplayKey'
      responses:
        '200':
          description: Processed image in JPEG format
          headers:
            X-Sleep-Seconds:
              description: Seconds the device should sleep before the next request
              schema:
                type: integer
                example: 300
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /pf/{displayKey}/image/random.png:
    get:
      tags:
        - device
      summary: Get a random image for a device (PNG)
      description: Same as `random.bin` but returns a PNG instead of the vendor binary.
      parameters:
        - $ref: '#/components/parameters/DisplayKey'
      responses:
        '200':
          description: Processed image in PNG format
          headers:
            X-Sleep-Seconds:
              description: Seconds the device should sleep before the next request
              schema:
                type: integer
                example: 300
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  parameters:
    CatalogKey:
      in: path
      name: catalogKey
      required: true
      description: Catalog identifier as defined in `service.yaml`
      schema:
        type: string
        example: photos

    DisplayKey:
      in: path
      name: displayKey
      required: true
      description: Display identifier — the ESP32 MAC address (e.g. `a1b2c3d4e5f6`) or `dev` for local testing
      schema:
        type: string
        example: dev

  schemas:
    ImageRecord:
      type: object
      description: A single image record in the NDJSON stream
      properties:
        id:
          type: integer
          description: Primary key of the image
          example: 42
        enabled:
          type: boolean
          description: Whether the image is visible (not soft-deleted)
          example: true
        timestamp:
          type: string
          description: EXIF shooting date in UTC (ISO 8601), or empty string if not available
          example: "2024-06-15T10:30:00Z"

    DeviceList:
      type: object
      properties:
        recording_enabled:
          type: boolean
          description: |
            Whether deliveries are being written down right now — false when
            `delivery_history.disabled` is set, or when the ring has no room in it.

            It qualifies everything below. With recording off the counts stop moving while
            `recent_window` goes on reading like a live setting, and frozen numbers presented as
            current would say "this frame stopped" when what stopped was the bookkeeping. The
            counts are still reported as they stand — the stored deliveries are real facts about
            the past — this only lets a reader know they are the past.
          example: true
        recent_window:
          type: integer
          description: |
            How many deliveries each display keeps. The bound on `recent_delivery_count` and
            `recent_error_count` below, and on the length of a `/api/device/{displayKey}/deliveries`
            result.
          example: 20
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    Device:
      type: object
      description: One configured display, and what the delivery history says about it
      properties:
        key:
          type: string
          description: Display identifier as defined in `service.yaml` — the ESP32 MAC address, or `dev`
          example: a1b2c3d4e5f6
        name:
          type: string
          example: living-room
        model:
          type: string
          description: e-Paper display model
          example: ws7in3e
        width:
          type: integer
          description: Panel width in pixels, from the display model rather than the configuration
          example: 800
        height:
          type: integer
          description: Panel height in pixels, from the display model rather than the configuration
          example: 480
        orientation:
          type: string
          description: How the panel is installed
          enum: [landscape, portrait]
          example: landscape
        catalog_keys:
          type: array
          description: Catalogs assigned to this display. Empty array, never null.
          items:
            type: string
          example: ["photos"]
        sleep_duration_seconds:
          type: integer
          description: The display's configured sleep interval, used when no wake schedule applies
          example: 300
        wake_schedule:
          type: array
          description: Cron expressions naming when this panel should be awake. Empty array, never null.
          items:
            type: string
          example: ["*/30 7-16 * * *"]
        last_delivered_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this display was last handed a picture, in UTC, or `null` when it never has
            been. Null and not an empty string: "never delivered to" is the most useful thing
            this endpoint says about a frame, and it must not read as a formatting slip.
          example: "2026-08-19T12:30:00Z"
        recent_delivery_count:
          type: integer
          description: |
            Deliveries still held for this display, bounded by `recent_window`. Not a lifetime
            total — the ring overwrites its oldest entry and keeps no count of what it dropped.
          example: 20
        recent_error_count:
          type: integer
          description: How many of those deliveries were error cards rather than pictures
          example: 3

    DeliveryList:
      type: object
      properties:
        device_key:
          type: string
          example: a1b2c3d4e5f6
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'

    Delivery:
      type: object
      description: |
        One picture handed to one display. Handed over is all it says: the record is written
        after the body has gone out and nothing can be added to it afterwards.
      properties:
        delivered_at:
          type: string
          format: date-time
          description: When the server wrote this picture out, in UTC
          example: "2026-08-19T12:30:00Z"
        kind:
          type: string
          description: Which delivery path produced the picture
          enum: [photo, http, colorbar, error]
          example: photo
        reason:
          type: string
          nullable: true
          description: |
            Why an error card was shown, as a code. `null` for every other kind.

            This is the only place the distinction survives: the provider decides it at the
            moment it gives up, and nothing downstream can work it out afterwards — the file
            provider reports success either way. Rendering the code for a reader is the client's
            job, so the wording can change without a server release.

            `load_failed` and `encode_failed` are not interchangeable and must not be collapsed:
            the first means the picture would not load, and sends an operator to look at the
            file; the second means it loaded fine and then would not convert to this panel's
            format, and sends them to look at the display model. Treat the list as open — a
            client should render a code it does not recognise rather than blanking it.
          enum: [no_images, db_error, file_missing, no_catalog, no_provider, unknown_display, load_failed, encode_failed]
          example: no_images
        image_id:
          type: integer
          nullable: true
          description: |
            The `images` row this came from, or `null` when the picture did not come from the
            catalog — a color bar, an error card, or a live HTTP fetch.
          example: 4821
        catalog_key:
          type: string
          nullable: true
          description: |
            Catalog the picture was drawn from, or `null` when nothing consulted one — a color
            bar, or an error raised before a catalog had been chosen.

            Null means "no catalog was involved", not "this went wrong": an error card from a
            provider that did have a catalog still names it, which is what says where to go
            looking.
          example: photos
        source:
          type: string
          nullable: true
          description: Path or URL the picture came from, or `null` for a delivery that names no file
          example: /mnt/photos/IMG_0421.jpg
        requested_sleep_seconds:
          type: integer
          description: |
            The `X-Sleep-Seconds` this response carried — what the server asked for, not an
            interval the device is known to have kept. A panel that never received the response
            fell back to its own.
          example: 300
        image_available:
          type: boolean
          description: |
            Whether the `images` row named above is still there. False for a delivery that
            never had one, and false once the photograph has been purged; a photograph merely
            hidden by the user is still there, so it stays true.
          example: true

    ErrorModel:
      type: object
      properties:
        error:
          type: object
          properties:
            description:
              type: string
              description: Human-readable error message
              example: "display not found"
            trace_id:
              type: string
              description: Request trace ID for log correlation
              example: "abc123def456"

  responses:
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            error:
              description: "internal server error"
              trace_id: "abc123def456"
